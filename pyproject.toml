[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dfppi"
version = "0.1.0"
description = "Prediction-powered fusion of a randomized trial and observational data for treatment effects"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.2"]

[project.optional-dependencies]
experiments = ["pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
dfppi = "dfppi.cli:main"

[tool.setuptools]
packages = ["dfppi"]
