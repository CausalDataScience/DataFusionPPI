name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and the experiment dependencies
        run: python -m pip install -e ".[experiments]"
      - name: Cache the benchmark data (IHDP, ACIC 2016)
        uses: actions/cache@v4
        with:
          path: experiments/.cache
          key: benchmark-data-${{ hashFiles('experiments/data.py') }}
      - name: Unit tests
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: python -m unittest discover -s tests -v
      - name: Command line
        run: python -m dfppi --help
